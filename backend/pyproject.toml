[project]
name = "fund-pooling-backend"
version = "0.1.0"
description = "Fund Pooling 后端服务（Django + Django REST framework）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "psycopg[binary]>=3.3.9,<3.4",
    "gunicorn>=27.0.1,<28",
    "whitenoise>=6.12.0,<7",
    "django-cors-headers>=4.9.0,<5",
    "python-dotenv>=1.1.1,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
