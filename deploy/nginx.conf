# fund_pooling — Nginx 反向代理配置模板
#
# 使用：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/fund_pooling.conf
#   sudo sed -i '' 's/fund.example.com/你的域名/' /etc/nginx/conf.d/fund_pooling.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS：先只启用 80 端口跑通，再执行
#   sudo certbot --nginx -d 你的域名
# certbot 会自动补全 443 配置（下面的 443 server 段是可选手写版本）。

server {
    listen 80;
    server_name fund.example.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

