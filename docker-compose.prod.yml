# =============================================================================
# 生产环境覆盖文件（与 docker-compose.yml 叠加使用）
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 与本地开发配置的差异：
#   1. web 只监听 127.0.0.1，HTTPS / 域名由宿主机反向代理负责
#   2. db 不向宿主机暴露 5432 端口
#   3. 增加资源上限与安全选项，Gunicorn worker 默认降到 3
#
# 需要 Docker Compose v2.24+（使用了 !reset / !override 合并标签）
# =============================================================================
name: fund_pooling

services:
  db:
    # 生产环境不需要把数据库端口暴露到宿主机/公网
    ports: !reset []

    shm_size: 256mb

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  web:
    # 只监听本机，外部流量必须经过反向代理（Caddy / Nginx）
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8000}:8000"

    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
